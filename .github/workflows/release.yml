name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag, application, and README versions
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoContent = Get-Content src-tauri/Cargo.toml -Raw
          $cargoVersionMatch = [regex]::Match($cargoContent, '(?m)^version\s*=\s*"([^"]+)"')
          $readmeContent = Get-Content README.md -Raw
          $readmeVersionMatch = [regex]::Match(
            $readmeContent,
            '<!--\s*release-version:\s*([0-9]+\.[0-9]+\.[0-9]+)\s*-->'
          )

          if (-not $cargoVersionMatch.Success) {
            throw 'Could not read the package version from src-tauri/Cargo.toml.'
          }
          if (-not $readmeVersionMatch.Success) {
            throw 'README.md must contain <!-- release-version: X.Y.Z -->.'
          }

          $cargoVersion = $cargoVersionMatch.Groups[1].Value
          $readmeVersion = $readmeVersionMatch.Groups[1].Value
          $versions = @{
            'package.json' = $packageVersion
            'src-tauri/Cargo.toml' = $cargoVersion
            'src-tauri/tauri.conf.json' = $tauriVersion
            'README.md' = $readmeVersion
          }
          $mismatches = $versions.GetEnumerator() | Where-Object { $_.Value -ne $tagVersion }

          if ($mismatches) {
            $details = ($mismatches | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ', '
            throw "Tag version $tagVersion does not match: $details"
          }

  build-desktop:
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            rustTargets: x86_64-pc-windows-msvc
            tauriTarget: x86_64-pc-windows-msvc
            bundles: nsis
            includeUpdaterJson: true
          - name: macOS Universal
            platform: macos-latest
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            tauriTarget: universal-apple-darwin
            bundles: app,dmg
            includeUpdaterJson: false

    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare release notes
        id: release-notes
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $escapedVersion = [regex]::Escape($version)
          $pattern = "(?ms)^## \[$escapedVersion\].*?(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)

          if (-not $match.Success) {
            throw "CHANGELOG.md does not contain a section for version $version."
          }

          $notes = $match.Value.Trim()
          if ($notes -match 'See CHANGELOG\.md for release details\.') {
            throw 'Release notes must contain the detailed changelog section.'
          }

          @('body<<EOF', $notes, 'EOF') | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8

      - name: Build installer, updater artifacts, and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '${{ github.ref_name }}'
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ matrix.includeUpdaterJson }}
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.tauriTarget }} --bundles ${{ matrix.bundles }}

  finalize-updater-manifest:
    needs: build-desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add macOS updater targets and route downloads through GitHub mirror
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $manifestDirectory = Join-Path $env:RUNNER_TEMP 'lightmarkit-updater'
          New-Item -ItemType Directory -Path $manifestDirectory -Force | Out-Null

          gh release download $tag `
            --repo '${{ github.repository }}' `
            --pattern latest.json `
            --dir $manifestDirectory

          $release = gh release view $tag `
            --repo '${{ github.repository }}' `
            --json assets | ConvertFrom-Json
          $macUpdater = @($release.assets | Where-Object { $_.name -match '\.app\.tar\.gz$' })
          $macSignature = @($release.assets | Where-Object { $_.name -match '\.app\.tar\.gz\.sig$' })

          if ($macUpdater.Count -ne 1 -or $macSignature.Count -ne 1) {
            throw 'Expected exactly one universal macOS updater archive and signature.'
          }

          $signatureName = $macSignature[0].name
          $signaturePath = Join-Path $manifestDirectory 'macos-updater.sig'
          gh release download $tag `
            --repo '${{ github.repository }}' `
            --pattern $signatureName `
            --output $signaturePath `
            --clobber

          $signature = (Get-Content $signaturePath -Raw -Encoding utf8).Trim()
          $assetName = [uri]::EscapeDataString($macUpdater[0].name)
          $downloadUrl = "https://gh-proxy.com/github.com/${{ github.repository }}/releases/download/$tag/$assetName"
          $macPlatform = [ordered]@{
            signature = $signature
            url = $downloadUrl
          }

          $manifestPath = Join-Path $manifestDirectory 'latest.json'
          $manifest = Get-Content $manifestPath -Raw -Encoding utf8 | ConvertFrom-Json
          $manifest.platforms | Add-Member -NotePropertyName 'darwin-aarch64' -NotePropertyValue $macPlatform -Force
          $manifest.platforms | Add-Member -NotePropertyName 'darwin-x86_64' -NotePropertyValue $macPlatform -Force

          foreach ($platform in $manifest.platforms.PSObject.Properties) {
            $platform.Value.url = $platform.Value.url -replace '^https://github\.com/', 'https://gh-proxy.com/github.com/'
          }

          $json = $manifest | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText(
            $manifestPath,
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )
          gh release upload $tag $manifestPath `
            --repo '${{ github.repository }}' `
            --clobber

          $notesPath = Join-Path $manifestDirectory 'release-notes.md'
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $version = $tag.TrimStart('v')
          $escapedVersion = [regex]::Escape($version)
          $pattern = "(?ms)^## \[$escapedVersion\].*?(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) {
            throw "CHANGELOG.md does not contain a section for version $version."
          }
          [System.IO.File]::WriteAllText(
            $notesPath,
            $match.Value.Trim() + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false)
          )

          gh release edit $tag `
            --repo '${{ github.repository }}' `
            --draft=false `
            --notes-file $notesPath
