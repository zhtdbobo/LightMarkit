name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag, application, and README versions
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoContent = Get-Content src-tauri/Cargo.toml -Raw
          $cargoVersionMatch = [regex]::Match($cargoContent, '(?m)^version\s*=\s*"([^"]+)"')
          $readmeContent = Get-Content README.md -Raw
          $readmeVersionMatch = [regex]::Match(
            $readmeContent,
            '<!--\s*release-version:\s*([0-9]+\.[0-9]+\.[0-9]+)\s*-->'
          )

          if (-not $cargoVersionMatch.Success) {
            throw 'Could not read the package version from src-tauri/Cargo.toml.'
          }
          if (-not $readmeVersionMatch.Success) {
            throw 'README.md must contain <!-- release-version: X.Y.Z -->.'
          }

          $cargoVersion = $cargoVersionMatch.Groups[1].Value
          $readmeVersion = $readmeVersionMatch.Groups[1].Value
          $versions = @{
            'package.json' = $packageVersion
            'src-tauri/Cargo.toml' = $cargoVersion
            'src-tauri/tauri.conf.json' = $tauriVersion
            'README.md' = $readmeVersion
          }
          $mismatches = $versions.GetEnumerator() | Where-Object { $_.Value -ne $tagVersion }

          if ($mismatches) {
            $details = ($mismatches | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ', '
            throw "Tag version $tagVersion does not match: $details"
          }

  build-desktop:
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            rustTargets: x86_64-pc-windows-msvc
            tauriTarget: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS Universal
            platform: macos-latest
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            tauriTarget: universal-apple-darwin
            bundles: dmg

    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed updater artifacts and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LightMarkit ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for release details.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.tauriTarget }} --bundles ${{ matrix.bundles }}

  finalize-updater-manifest:
    needs: build-desktop
    runs-on: ubuntu-latest

    steps:
      - name: Route updater downloads through GitHub mirror
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifestDirectory = Join-Path $env:RUNNER_TEMP 'lightmarkit-updater'
          New-Item -ItemType Directory -Path $manifestDirectory -Force | Out-Null
          gh release download '${{ github.ref_name }}' `
            --repo '${{ github.repository }}' `
            --pattern latest.json `
            --dir $manifestDirectory

          $manifestPath = Join-Path $manifestDirectory 'latest.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $platformNames = @($manifest.platforms.PSObject.Properties.Name)

          if (-not ($platformNames | Where-Object { $_ -like 'windows-*' })) {
            throw "Updater manifest is missing a Windows platform: $($platformNames -join ', ')"
          }
          if (-not ($platformNames | Where-Object { $_ -like 'darwin-*' })) {
            throw "Updater manifest is missing a macOS platform: $($platformNames -join ', ')"
          }

          foreach ($platform in $manifest.platforms.PSObject.Properties) {
            $downloadUrl = [string]$platform.Value.url
            if (-not $downloadUrl.StartsWith('https://github.com/')) {
              throw "Unexpected updater download URL: $downloadUrl"
            }

            $platform.Value.url = 'https://gh-proxy.com/' + $downloadUrl.Substring('https://'.Length)
          }

          $manifest | ConvertTo-Json -Depth 10 | Set-Content $manifestPath -Encoding utf8 -NoNewline
          gh release upload '${{ github.ref_name }}' $manifestPath `
            --repo '${{ github.repository }}' `
            --clobber
